# ═══════════════════════════════════════════════════
#  Arena — PostgreSQL + Redis + API
#  بەکارهێنان: docker compose up -d --build
# ═══════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_secret_2026
      POSTGRES_DB: arena_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://arena:arena_secret_2026@postgres:5432/arena_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_to_a_long_random_secret_string
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_DAYS: 30
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,https://arena.com,http://arena.com
      TRUST_PROXY: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # seed بە دەست دەکرێت: docker compose run --rm api sh -c "npx tsx src/seed/seed.ts"
    # یان: docker compose exec api node -e "..."

volumes:
  pgdata:
